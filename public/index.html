<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cadastro de Produtos</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="container">
  <h1>Cadastro de Produtos</h1>
  <p>Interface simples para consumir a API de produtos criada com Express e MySQL.</p>


  <section class="card">
   <h2>Cadastrar produto</h2>


   <form id="form-produto">
    <label for="nome">Nome</label>
    <input type="text" id="nome" required>


    <label for="preco">Preço</label>
    <input type="number" id="preco" step="0.01" required>


    <label for="descricao">Descrição</label>
    <textarea id="descricao"></textarea>


    <button type="submit">Cadastrar</button>
   </form>
  </section>


  <section class="card">
   <h2>Buscar produto por id</h2>


   <div class="linha-busca">
    <input type="number" id="busca-id" placeholder="Digite o id do produto">
    <button id="btn-buscar">Buscar</button>
   </div>


   <div id="resultado-busca"></div>
  </section>


  <section class="card">
   <div class="topo-lista">
    <h2>Produtos cadastrados</h2>
    <button id="btn-listar">Atualizar lista</button>
   </div>


   <div id="lista-produtos"></div>
  </section>
 </main>


 <script src="script.js"></script>
</body>
</html>
